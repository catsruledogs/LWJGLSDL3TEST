name: Development build

on:
  pull_request:
    types: [opened, reopened]
    branches: ['Amethyst-iOS-J25Exp', 'main']
  push:
    branches: ['Amethyst-iOS-J25Exp', 'main']
  workflow_dispatch:

jobs:
  build:
    name: Development build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Using $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup JDK 8 (Zulu)
        uses: actions/setup-java@v5
        id: setup-java
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install brew dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew update
          brew install make wget ldid cmake
          sudo mkdir -p /usr/local/bin
          sudo ln -sf /opt/homebrew/bin/gmake /usr/local/bin/gmake

      - name: Cache iOS JREs
        id: cache-jres
        uses: actions/cache@v5
        with:
          path: depends/
          key: amethyst-jres-v2

      - name: Resolve env
        run: |
          echo "SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          echo "RUNNER=0" >> $GITHUB_ENV

      - name: Verify tools
        run: |
          gmake --version | head -1
          cmake --version | head -1
          xcrun --sdk iphoneos --show-sdk-version

      - name: Download & build libSDL3 from source
        run: |
          SDL3_VERSION="release-3.4.0"
          SDL3_DIR="lwjgl-lib/amethyst-prebuilt-libraries-master/SDL/SDL3"

          # Download vanilla SDL3 source
          rm -rf "$SDL3_DIR"
          wget -q "https://github.com/libsdl-org/SDL/archive/refs/tags/${SDL3_VERSION}.tar.gz" -O /tmp/sdl3.tar.gz
          mkdir -p "$SDL3_DIR"
          tar xzf /tmp/sdl3.tar.gz --strip-components=1 -C "$SDL3_DIR"
          rm /tmp/sdl3.tar.gz

          # Apply Amethyst patches (hitTest, embed, input bridge registration, etc.)
          git apply --stat --directory="$SDL3_DIR" patches/sdl3-amethyst.patch
          git apply --directory="$SDL3_DIR" patches/sdl3-amethyst.patch

          # Build for iOS
          cd "$SDL3_DIR"
          mkdir -p build-ios && cd build-ios
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DSDL_VULKAN=ON \
            -DSDL_METAL=ON \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF
          cmake --build . -j$(sysctl -n hw.ncpu)
          echo "libSDL3 built successfully"
          ls -la libSDL3*.dylib

      - name: Install libSDL3 into resources
        run: |
          cp lwjgl-lib/amethyst-prebuilt-libraries-master/SDL/SDL3/build-ios/libSDL3.0.dylib \
             Natives/resources/Frameworks/libSDL3.dylib
          echo "libSDL3.dylib installed"

      - name: Build sideload IPA & TrollStore tIPA
        shell: bash
        run: |
          echo '#import <mach/mach.h>' | cat - Natives/JavaLauncher.m > temp && mv temp Natives/JavaLauncher.m

          JDK_BASE_PATH="${{ steps.setup-java.outputs.path }}"
          export PATH="$JDK_BASE_PATH/bin:/opt/homebrew/bin:$PATH"
          export JAVA_HOME="$JDK_BASE_PATH"
          export BOOTJDK="$JDK_BASE_PATH/bin"
          export SLIMMED=1
          
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""

          export CFLAGS="-Wno-error=implicit-function-declaration $CFLAGS"
          export CXXFLAGS="-Wno-error=implicit-function-declaration $CXXFLAGS"

          SIGN_FLAGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="

          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 $SIGN_FLAGS 2> >(grep -v "vtool warning: code signature will be invalid" >&2)
          
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 TROLLSTORE_JIT_ENT=1 $SIGN_FLAGS 2> >(grep -v "vtool warning: code signature will be invalid" >&2)

      - name: List artifacts
        if: always()
        run: ls -la artifacts/ || true

      - name: Upload TrollStore tIPA (full)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: org.angelauramc.amethyst-ios-trollstore
          path: artifacts/org.angelauramc.amethyst-*-ios-trollstore.tipa
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0

      - name: Upload TrollStore tIPA (slimmed)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: org.angelauramc.amethyst-ios-trollstore-slimmed
          path: artifacts/org.angelauramc.amethyst.slimmed-*-ios-trollstore.tipa
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0

      - name: Upload regular IPA (full)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: org.angelauramc.amethyst-ios
          path: artifacts/org.angelauramc.amethyst-*-ios.ipa
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0

      - name: Upload regular IPA (slimmed)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: org.angelauramc.amethyst-ios-slimmed
          path: artifacts/org.angelauramc.amethyst.slimmed-*-ios.ipa
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0

      - name: Upload AngelAuraAmethyst.dSYM
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: AngelAuraAmethyst.dSYM
          path: artifacts/AngelAuraAmethyst.dSYM
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            Natives/build/CMakeFiles/CMakeOutput.log
            Natives/build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
